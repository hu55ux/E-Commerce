<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script defer src="./script.js"></script>
  <link rel="stylesheet" href="../style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <title>Register</title>
</head>

<body class="w-full min-h-screen h-full">
  <div class="max-w-[1440px] w-full mx-auto">
    <div class="flex items-center mt-[130px] gap-[130px]">
      <img class="w-[805px] h-[780px]" src="../asset/images/auth.png" alt="authimg.png" />

      <div class="flex flex-col">
        <h1 class="inter-medium text-[36px]">Create an account</h1>
        <p class="inter mt-6">Enter your details below</p>

        <div class="mt-12 flex flex-col gap-10">
          <input id="registerNameInput" class="border-b border-black pb-2" placeholder="First Name" type="text"
            name="" />
          <input id="registerLastnameInput" class="border-b border-black pb-2" placeholder="Last Name" type="text"
            name="" />
          <input id="registerEmailInput" class="border-b border-black pb-2" placeholder="Email" type="email" name="" />
          <input id="registerPasswordInput" class="border-b border-black pb-2" placeholder="Password" type="password"
            name="" />
        </div>

        <button id="registerBtn" class="mt-10 bg-[#DB4444] py-4 inter-medium text-white">
          Create Account
        </button>

        <a class="block mt-4 inter-light" href="../login/login.html">Already have account?
          <span class="inter-medium underline">Log in</span></a>
      </div>
    </div>
  </div>
</body>

</html>
